[package]
name = "trackwright"
description = "Trackwright: planar motion tracking and (soon) camera tracking"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "trackwright_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp", "webp"] }
dirs = "6"
trackwright-core = { path = "../crates/trackwright-core", features = ["parallel"] }
ureq = "2"
sha2 = "0.10"
trackwright-ai = { version = "0.1.0", path = "../crates/trackwright-ai" }
