[workspace]
resolver = "2"
members = ["crates/trackwright-core", "crates/trackwright-import", "src-tauri", "ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Scott Hambach"]
license = "LicenseRef-Proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.dev.package.trackwright-core]
# Tracking math is unusably slow unoptimised; keep it fast even in dev builds.
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
