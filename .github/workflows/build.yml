name: Build

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tracking engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p trackwright-core -p trackwright-import --release

  windows:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install Trunk
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/trunk-rs/trunk/releases/latest/download/trunk-x86_64-pc-windows-msvc.zip -OutFile trunk.zip
          Expand-Archive trunk.zip -DestinationPath "$env:USERPROFILE\.cargo\bin" -Force
          trunk --version

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build app and installers
        run: npx --yes @tauri-apps/cli@^2 build

      - uses: actions/upload-artifact@v4
        with:
          name: Trackwright-windows
          path: |
            target/release/trackwright.exe
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi

      - name: Publish rolling "latest" build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest --prerelease --target "$GITHUB_SHA" \
            --title "Latest build ($(git rev-parse --short HEAD))" \
            --notes "Automatic build of main at $GITHUB_SHA. trackwright.exe runs without installing; the setup .exe / .msi install it." \
            target/release/trackwright.exe target/release/bundle/nsis/*.exe target/release/bundle/msi/*.msi

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
