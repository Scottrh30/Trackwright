name: Build

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tracking engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p trackwright-core -p trackwright-import --release

  ai-model:
    name: AI tracker model (ai-models release)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ALLTRACKER_COMMIT: e7553135e7b361590dbccd10e2b274b024f41cd6
    steps:
      - uses: actions/checkout@v4
      - name: Already published?
        id: check
        run: |
          if gh release view ai-models --json assets -q '.assets[].name' 2>/dev/null | grep -q SHA256SUMS.txt; then
            echo "have=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.check.outputs.have != '1'
        with:
          python-version: "3.12"
      - name: Export AllTracker to ONNX and publish
        if: steps.check.outputs.have != '1'
        run: |
          set -e
          python -m pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet einops numpy onnx
          git clone --quiet https://github.com/aharley/alltracker.git at
          (cd at && git checkout --quiet "$ALLTRACKER_COMMIT" && python ../tools/ai-model/patch_alltracker.py)
          curl -sSL -o alltracker.pth https://huggingface.co/aharley/alltracker/resolve/main/alltracker.pth
          mkdir out
          python tools/ai-model/export_onnx.py at alltracker.pth out
          cp at/LICENSE out/ALLTRACKER_LICENSE.txt
          (cd out && sha256sum at_encoder.onnx at_window.onnx > SHA256SUMS.txt && cat SHA256SUMS.txt)
          gh release delete ai-models -y --cleanup-tag || true
          gh release create ai-models --prerelease --title "AI tracker model (AllTracker)" \
            --notes "AllTracker (Harley et al., ICCV 2025; MIT licence, see ALLTRACKER_LICENSE.txt) exported to ONNX for Trackwright's AI assist. The app downloads these files when you ask it to. Built by tools/ai-model from the authors' weights at commit $ALLTRACKER_COMMIT." \
            out/at_encoder.onnx out/at_window.onnx out/SHA256SUMS.txt out/ALLTRACKER_LICENSE.txt

  windows:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install Trunk
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/trunk-rs/trunk/releases/latest/download/trunk-x86_64-pc-windows-msvc.zip -OutFile trunk.zip
          Expand-Archive trunk.zip -DestinationPath "$env:USERPROFILE\.cargo\bin" -Force
          trunk --version

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch FFmpeg to bundle in the installers
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force src-tauri/ffmpeg | Out-Null
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-x -Force
          Get-ChildItem ffmpeg-x -Recurse -Include ffmpeg.exe, ffprobe.exe | Copy-Item -Destination src-tauri/ffmpeg -Force
          $lic = Get-ChildItem ffmpeg-x -Recurse -Include LICENSE, LICENSE.txt | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName src-tauri/ffmpeg/FFmpeg-LICENSE.txt } else { "FFmpeg is licensed under the GPL v3. Build from https://www.gyan.dev/ffmpeg/builds/ ; source at https://ffmpeg.org" | Set-Content src-tauri/ffmpeg/FFmpeg-LICENSE.txt }
          Get-ChildItem src-tauri/ffmpeg | Format-Table Name, Length
          # Installer-only overlay: ffmpeg.exe / ffprobe.exe go next to trackwright.exe.
          '{"bundle":{"resources":{"ffmpeg/ffmpeg.exe":"ffmpeg.exe","ffmpeg/ffprobe.exe":"ffprobe.exe","ffmpeg/FFmpeg-LICENSE.txt":"FFmpeg-LICENSE.txt"}}}' | Set-Content -Encoding ascii src-tauri/tauri.ffmpeg.json

      - name: Fetch ONNX Runtime (for the optional AI tracker)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $v = "1.22.0"
          Invoke-WebRequest "https://github.com/microsoft/onnxruntime/releases/download/v$v/onnxruntime-win-x64-$v.zip" -OutFile ort.zip
          Expand-Archive ort.zip -DestinationPath ort-x -Force
          New-Item -ItemType Directory -Force src-tauri/ort | Out-Null
          Get-ChildItem ort-x -Recurse -Include onnxruntime.dll | Select-Object -First 1 | Copy-Item -Destination src-tauri/ort/ -Force
          Get-ChildItem ort-x -Recurse -Include LICENSE, LICENSE.txt | Select-Object -First 1 | Copy-Item -Destination src-tauri/ort/ONNXRuntime-LICENSE.txt -Force
          Get-ChildItem src-tauri/ort | Format-Table Name, Length
          $cfg = Get-Content src-tauri/tauri.ffmpeg.json | ConvertFrom-Json
          $cfg.bundle.resources | Add-Member -NotePropertyName "ort/onnxruntime.dll" -NotePropertyValue "onnxruntime.dll"
          $cfg.bundle.resources | Add-Member -NotePropertyName "ort/ONNXRuntime-LICENSE.txt" -NotePropertyValue "ONNXRuntime-LICENSE.txt"
          $cfg | ConvertTo-Json -Depth 5 | Set-Content -Encoding ascii src-tauri/tauri.ffmpeg.json
          Get-Content src-tauri/tauri.ffmpeg.json

      - name: Build app and installers (with FFmpeg)
        run: npx --yes @tauri-apps/cli@^2 build --config "${{ github.workspace }}/src-tauri/tauri.ffmpeg.json"

      - name: Package Trackwright-windows.zip (exe + FFmpeg helper)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force zip-staging | Out-Null
          Copy-Item target/release/trackwright.exe zip-staging/
          Copy-Item packaging/windows/get-ffmpeg.bat zip-staging/
          Copy-Item packaging/windows/README.txt zip-staging/
          Copy-Item src-tauri/ort/onnxruntime.dll zip-staging/
          Copy-Item src-tauri/ort/ONNXRuntime-LICENSE.txt zip-staging/
          Compress-Archive -Path zip-staging/* -DestinationPath Trackwright-windows.zip -Force
          Get-Item Trackwright-windows.zip | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Trackwright-windows
          path: |
            Trackwright-windows.zip
            target/release/trackwright.exe
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi

      - name: Publish rolling "latest" build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest --prerelease --target "$GITHUB_SHA" \
            --title "Latest build ($(git rev-parse --short HEAD))" \
            --notes "Automatic build of main at $GITHUB_SHA. Trackwright-windows.zip holds trackwright.exe (runs without installing) and get-ffmpeg.bat; the setup .exe / .msi install it with FFmpeg included." \
            Trackwright-windows.zip target/release/trackwright.exe target/release/bundle/nsis/*.exe target/release/bundle/msi/*.msi

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Trackwright-windows.zip
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
