[package]
name = "trackwright-core"
description = "Planar tracking engine for Trackwright: pyramidal KLT, robust motion fitting, corner-pin solving and exporters."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
rayon = { version = "1", optional = true }

[features]
default = []
# Multi-threaded tracking (used by the desktop app).
parallel = ["dep:rayon"]

[dev-dependencies]
# Only for examples/track_clip.rs (reads real footage for testing).
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
